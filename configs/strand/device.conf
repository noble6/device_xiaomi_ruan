# Strand profiles for ruan (SM7435 parrot: policy0 4x A55, policy4 4x A78,
# Adreno 710). Added to /system_ext/etc/strand/strand.conf.
#
# CPU and GPU limits belong to the power HAL (configs/power/powerhint.json),
# which restores its own values after every boost, so the profiles switch
# its modes instead of writing those nodes:
#   performance, gaming: FIXED_PERFORMANCE (CPU floor 1.5 GHz, GPU >= 600 MHz)
#   battery: LOW_POWER through battery saver (big cores <= 1.9 GHz, GPU <= 500 MHz)

[profile performance]
fixedperf on
setting system min_refresh_rate 120.0

[profile battery]
setting system peak_refresh_rate 60.0

[profile gaming]
fixedperf on
setting system min_refresh_rate 120.0

[stats]
stat gpu_busy_pct /sys/class/kgsl/kgsl-3d0/gpu_busy_percentage
stat gpu_freq_mhz /sys/class/kgsl/kgsl-3d0/devfreq/cur_freq 1000000
stat battery_pct /sys/class/power_supply/battery/capacity
stat battery_temp_dc /sys/class/power_supply/battery/temp
stat battery_cycles /sys/class/power_supply/battery/cycle_count
stat battery_full_uah /sys/class/power_supply/battery/charge_full
stat battery_design_uah /sys/class/power_supply/battery/charge_full_design
